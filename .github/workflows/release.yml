name: release

# On a version tag, build the Grimoire binary natively on each target OS and
# attach the archives to a single GitHub Release. Windows ships the pure-Go
# webview2 binary (no extra DLLs); Linux/macOS link mass-sdk/webview (CGO)
# against GTK3 + WebKitGTK 4.1 on the host.
#
# workflow_dispatch runs the same builds as a dry run — every job except
# `publish`, which is tag-gated (softprops needs a tag ref to attach to).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write

# Never let two releases of the same tag interleave uploads; unlike ci.yml, an
# in-flight release is not safe to cancel — it may have published assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOPRIVATE: github.com/chinese-room-solutions/*

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `asset` is the release-asset basename: grimoire_<goos>_<goarch>, no
        # version — stable names keep releases/latest/download/ links evergreen
        # (the website and READMEs hardcode them).
        include:
          # `setup_asset` is the stable name of the RAW installer binary (the
          # self-extracting grimoire-setup, not the double-clickable container) —
          # install.sh's `curl | sh` path fetches and execs it, so it needs a
          # container-free executable at an evergreen
          # releases/latest/download URL. Windows has no container to strip (the
          # console .exe is already the raw installer), so it needs no entry.
          #
          # Pinned, not -latest: GUI deps are provisioned per-image, so a silent
          # image migration is a silent build change. The Linux binary itself is
          # built in a container, not on this image — see the build step.
          - os: ubuntu-24.04
            label: linux-amd64
            asset: grimoire_linux_amd64
            setup_asset: grimoire-setup_linux_amd64
          - os: windows-latest
            label: windows-amd64
            asset: grimoire_windows_amd64
          - os: macos-15
            label: macos-arm64
            asset: grimoire_darwin_arm64
            setup_asset: grimoire-setup_darwin_arm64
    steps:
      # Full history, not a shallow clone: `make package` stamps the version from
      # `git describe --tags`, which needs the tags present — including on
      # dispatch dry runs, where no tag ref is checked out.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Linux builds in a container with its own Go, so only the host-built
      # targets need a toolchain here.
      - uses: actions/setup-go@v7
        if: runner.os != 'Linux'
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Configure private module access
        shell: bash
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      # The GUI binary links GTK/WebKit dynamically against the host's system
      # libs, so the build host's glibc becomes the floor for every user. Built
      # on the 24.04 runner that floor is 2.39, which excludes Ubuntu 22.04 and
      # Debian 12; built in ubuntu:22.04 the binary tops out at GLIBC_2.34, so
      # Debian 12 and RHEL 9 work too. Jammy is as far back as we can go —
      # webkit2gtk-4.1 does not exist before it (focal has only the retired
      # 4.0), and our cgo requires 4.1.
      - name: Build + package (Linux, in ubuntu:22.04 for an old-glibc floor)
        if: runner.os == 'Linux'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Match the toolchain to go.mod rather than pinning a second version here.
          govers="$(sed -n 's/^go //p' go.mod)"
          docker run --rm -v "$PWD:/src" -w /src \
            -e GOPRIVATE -e GH_PAT -e GOVERS="$govers" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            ubuntu:22.04 bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              # A bare base image lacks things the runner images happen to ship:
              # g++ (mass-sdk vendors webview.h, which is C++), and
              # squashfs-tools/desktop-file-utils/file/zsync for appimagetool.
              apt-get install -y -qq --no-install-recommends \
                ca-certificates curl git gcc g++ make pkg-config \
                libgtk-3-dev libwebkit2gtk-4.1-dev \
                squashfs-tools desktop-file-utils file zsync
              curl -fsSL "https://go.dev/dl/go${GOVERS}.linux-amd64.tar.gz" | tar -C /usr/local -xz
              export PATH="/usr/local/go/bin:${PATH}"
              # The bind-mounted checkout is owned by the runner user, not root.
              git config --global --add safe.directory /src
              git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
              pkg-config --print-errors --exists gtk+-3.0 webkit2gtk-4.1
              make package
              # Hand the tree back, or the Archive step below cannot move the
              # root-owned outputs out of bin/ and dist/.
              chown -R "${HOST_UID}:${HOST_GID}" /src
            '
      - name: Build
        if: runner.os != 'Linux'
        run: make build
      # Installer wizard (grimoire-setup): ditto-zipped .app on macOS, console
      # .exe on Windows. The bundlers self-fetch their tools, so no extra CI deps.
      # The raw self-extracting installer stays beside the container; the Archive
      # step uploads it for install.sh.
      - name: Package installer
        if: runner.os != 'Linux'
        run: make package
      - name: Archive
        shell: bash
        run: |
          name="${{ matrix.asset }}"
          setup="grimoire-setup_${name#grimoire_}"
          # Stable name of the raw, container-free installer that install.sh
          # fetches. Empty on Windows, whose .exe above is already container-free.
          raw="${{ matrix.setup_asset }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$name.zip" ./bin/grimoire.exe
            mv dist/grimoire-setup.exe "$setup.exe"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            tar -czf "$name.tar.gz" -C bin grimoire
            mv dist/Grimoire-Setup.zip "$setup.zip"
            mv dist/grimoire-setup "$raw"
          else
            tar -czf "$name.tar.gz" -C bin grimoire
            mv dist/*.AppImage "$setup.AppImage"
            mv dist/grimoire-setup "$raw"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            grimoire_*.tar.gz
            grimoire_*.zip
            grimoire-setup_*

  publish:
    needs: build
    # Tag-gated: a workflow_dispatch run is a build dry run, with no tag for the
    # release to attach to. Without this the whole run ends red on success.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      # download-artifact nests each matrix leg in its own directory, so flatten
      # first and checksum exactly what gets uploaded.
      - name: Collect assets and checksum them
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'grimoire_*' -o -name 'grimoire-setup_*' \) \
            -exec mv -t release {} +
          cd release
          sha256sum grimoire_* grimoire-setup_* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          # Missing assets are a failed release, not a partial one.
          fail_on_unmatched_files: true
          # Publishes live on tag, same as the other MASS repos: a release is
          # now a rollout trigger for self-updating installs, and the tag push
          # is the deliberate act.
          draft: false
