name: ci

# Grimoire is a GUI app; the native window links webview_go (CGO) on Linux/macOS.
# CI builds on Linux + Windows only — macOS is a 10x-billed runner, so it's
# exercised by release.yml instead. Lint + vulncheck on Linux. Cross-repo deps
# (mass-sdk, llama-cpp-openai-client-go, pdf) are private — fetched via GH_PAT.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPRIVATE: github.com/chinese-room-solutions/*

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Configure private module access
        shell: bash
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Install Linux GUI deps (cached)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0
      - name: Alias webkit2gtk pkg-config 4.0 -> 4.1
        if: runner.os == 'Linux'
        run: |
          # webview_go hardcodes pkg-config webkit2gtk-4.0, but Ubuntu 24.04
          # ships only 4.1 (API-compatible). Alias the .pc files, in the dir
          # where the 4.1 ones actually live, so cgo resolves.
          pcdir=$(pkg-config --variable=pcfiledir webkit2gtk-4.1)
          sudo ln -sf "$pcdir/webkit2gtk-4.1.pc" "$pcdir/webkit2gtk-4.0.pc"
          sudo ln -sf "$pcdir/javascriptcoregtk-4.1.pc" "$pcdir/javascriptcoregtk-4.0.pc"
      - name: Build
        run: make build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Install Linux GUI deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0
      - name: Alias webkit2gtk pkg-config 4.0 -> 4.1
        run: |
          # webview_go hardcodes pkg-config webkit2gtk-4.0, but Ubuntu 24.04
          # ships only 4.1 (API-compatible). Alias the .pc files, in the dir
          # where the 4.1 ones actually live, so cgo resolves.
          pcdir=$(pkg-config --variable=pcfiledir webkit2gtk-4.1)
          sudo ln -sf "$pcdir/webkit2gtk-4.1.pc" "$pcdir/webkit2gtk-4.0.pc"
          sudo ln -sf "$pcdir/javascriptcoregtk-4.1.pc" "$pcdir/javascriptcoregtk-4.0.pc"
      - name: Test
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Install Linux GUI deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0
      - name: Alias webkit2gtk pkg-config 4.0 -> 4.1
        run: |
          # webview_go hardcodes pkg-config webkit2gtk-4.0, but Ubuntu 24.04
          # ships only 4.1 (API-compatible). Alias the .pc files, in the dir
          # where the 4.1 ones actually live, so cgo resolves.
          pcdir=$(pkg-config --variable=pcfiledir webkit2gtk-4.1)
          sudo ln -sf "$pcdir/webkit2gtk-4.1.pc" "$pcdir/webkit2gtk-4.0.pc"
          sudo ln -sf "$pcdir/javascriptcoregtk-4.1.pc" "$pcdir/javascriptcoregtk-4.0.pc"
      - name: Generate templ (lint needs generated sources)
        run: go tool templ generate
      # Build golangci-lint from source with this repo's Go (via `make lint`)
      # rather than golangci-lint-action's prebuilt binary — the prebuilt one is
      # compiled with an older Go and refuses to analyze a newer-Go module.
      - name: Lint
        env:
          GOPRIVATE: github.com/chinese-room-solutions/*
        run: make lint

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Install Linux GUI deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0
      - name: Alias webkit2gtk pkg-config 4.0 -> 4.1
        run: |
          pcdir=$(pkg-config --variable=pcfiledir webkit2gtk-4.1)
          sudo ln -sf "$pcdir/webkit2gtk-4.1.pc" "$pcdir/webkit2gtk-4.0.pc"
          sudo ln -sf "$pcdir/javascriptcoregtk-4.1.pc" "$pcdir/javascriptcoregtk-4.0.pc"
      # Reuse the warm setup-go cache instead of golang/govulncheck-action
      # (which installs its own Go and recompiles the whole CGO tree cold).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
