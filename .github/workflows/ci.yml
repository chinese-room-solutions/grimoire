name: ci

# Grimoire is a GUI app; the native window links mass-sdk/webview (CGO: GTK3 +
# WebKitGTK 4.1) on Linux/macOS.
# CI builds on Linux + Windows only — macOS is a 10x-billed runner, so it's
# exercised by release.yml instead. Lint + vulncheck on Linux. Cross-repo deps
# (mass-sdk, llama-cpp-openai-client-go, pdf) are private — fetched via GH_PAT.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPRIVATE: github.com/chinese-room-solutions/*

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned, not -latest: GitHub is migrating ubuntu-latest to 26.04, and
        # the GUI deps here are provisioned per-image.
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Configure private module access
        shell: bash
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        # Bounded, so a stuck apt fails the step in minutes instead of hanging
        # the job. Room for the action's own 300s + 600s transfer bounds.
        timeout-minutes: 17
        uses: ./.github/actions/linux-gui-deps
      - name: Build
        run: make build

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Install Linux GUI deps
        timeout-minutes: 17
        uses: ./.github/actions/linux-gui-deps
      - name: Test
        run: make test

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Install Linux GUI deps
        timeout-minutes: 17
        uses: ./.github/actions/linux-gui-deps
      - name: Generate templ (lint needs generated sources)
        run: go tool templ generate
      # Build golangci-lint from source with this repo's Go (via `make lint`)
      # rather than golangci-lint-action's prebuilt binary — the prebuilt one is
      # compiled with an older Go and refuses to analyze a newer-Go module.
      - name: Lint
        env:
          GOPRIVATE: github.com/chinese-room-solutions/*
        run: make lint

  vulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Install Linux GUI deps
        timeout-minutes: 17
        uses: ./.github/actions/linux-gui-deps
      # Reuse the warm setup-go cache instead of golang/govulncheck-action
      # (which installs its own Go and recompiles the whole CGO tree cold).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
