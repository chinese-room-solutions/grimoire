language: Python
display_name: Python
# Identity is the folder: kernels/python/<version>/. The folder version is just a
# label hint — the kernel runs whatever `python3` (or `python` on Windows) is on
# PATH, so the live version is the host's.
#
# Runs Python blocks in one long-lived interpreter per note, so blocks share state
# (variables, imports, functions) across runs like notebook cells. Third-party
# packages must already be installed into that interpreter (pip install …); the
# kernel never manages packages — the host owns the dependency surface.
match: [python, py, python3]
runner: runner.py
command:
  default: { exe: python3, args: ["{runner}"] }
  windows: { exe: python, args: ["{runner}"] }
